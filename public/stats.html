<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenRouter Chat — Stats</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stats-app">
    <header class="chat-header">
      <h1>Session Stats</h1>
      <div class="header-right">
        <a href="/" class="stats-link">&larr; Back to Chat</a>
      </div>
    </header>

    <main class="stats-main">
      <div id="stats-loading" class="empty-state">Loading stats...</div>
      <div id="stats-empty" class="empty-state hidden">
        No sessions logged yet. End a chat to see stats here.
      </div>

      <div id="stats-content" class="hidden">
        <section class="summary-cards" id="summary-cards"></section>

        <section class="stats-table-section">
          <h2>Breakdown by Model</h2>
          <div class="table-wrap">
            <table class="stats-table">
              <thead>
                <tr id="stats-table-head-row"></tr>
              </thead>
              <tbody id="stats-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="stats.js"></script>
</body>
</html>
